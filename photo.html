<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' https://lh3.googleusercontent.com; connect-src https://lh3.googleusercontent.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f4f6">
<title>靑春의 순간 · 사진 받기</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<!-- Pretendard에는 한자가 없어 제목의 靑春 두 글자만 고딕으로 받는다 -->
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@800&text=%E9%9D%91%E6%98%A5&display=swap" rel="stylesheet">
<style>
:root{--blue:#3182f6;--blue-press:#1b64da;--blue-soft:#e8f3ff;--bg:#f2f4f6;--t1:#191f28;--t2:#4e5968;--t3:#8b95a1}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--t1);font-family:"Pretendard Variable",Pretendard,"Noto Sans KR",system-ui,sans-serif;font-size:17px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased;padding:28px 20px calc(110px + env(safe-area-inset-bottom));text-align:center}
.eyebrow{display:inline-block;font-size:14px;font-weight:700;color:var(--blue);background:var(--blue-soft);padding:5px 11px;border-radius:999px;margin-bottom:10px}
h1{font-weight:800;font-size:30px;letter-spacing:-.03em;line-height:1.25;margin:0 0 20px}
h1 b{font-family:"Noto Sans KR","Pretendard Variable",sans-serif;font-weight:800}
img{display:block;width:min(100%,400px);margin:0 auto;background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,27,55,.16)}
p{margin:18px auto 0;max-width:24em;color:var(--t3);font-size:15px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 20px max(16px,env(safe-area-inset-bottom));background:linear-gradient(rgba(242,244,246,0),var(--bg) 30%)}
button{display:block;width:min(100%,400px);margin:0 auto;font:inherit;font-size:18px;font-weight:700;color:#fff;background:var(--blue);border:0;border-radius:16px;padding:18px;cursor:pointer;transition:transform .15s,background-color .15s}
button:active{transform:scale(.97);background:var(--blue-press)}
</style>
</head>
<body>
<span class="eyebrow">월곶중 네 컷 사진</span>
<h1><b>靑春</b>의 순간</h1>
<img id="pic" alt="네 컷 사진">
<p id="msg">저장이 안 되면 사진을 길게 눌러 저장하세요.<br>24시간 뒤에는 사진이 사라져요.</p>
<div class="bar"><button id="save">사진 저장하기</button></div>
<script src="photo.js"></script>
</body>
</html>
